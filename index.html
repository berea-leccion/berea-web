<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: a sunrise page. Warm sky hero with an illustrated scene, then a live phone demo of the bot, then calm warm bands. */
:root{
  --bg:#fff7ec; --bg2:#ffeacb; --surface:#ffffff; --fg:#2a1b3d; --muted:#6b5877;
  --sun:#f59e0b; --coral:#ef6a4c; --sky:#2b3a9f; --leaf:#2f8f6b; --line:#f0d9b5;
  --on-sky:#fff8ea; --chat-bg:#e9f1fb; --bubble-bot:#ffffff; --bubble-me:#d7f0c2;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1230; --bg2:#241a40; --surface:#2a2049; --fg:#fff1dc; --muted:#c7b6d8;
  --sun:#ffb938; --coral:#ff8a6b; --sky:#8aa0ff; --leaf:#5ad1a0; --line:#3d3066;
  --chat-bg:#1d2a44; --bubble-bot:#2c3a5a; --bubble-me:#2d6a4d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1230; --bg2:#241a40; --surface:#2a2049; --fg:#fff1dc; --muted:#c7b6d8;
  --sun:#ffb938; --coral:#ff8a6b; --sky:#8aa0ff; --leaf:#5ad1a0; --line:#3d3066;
  --chat-bg:#1d2a44; --bubble-bot:#2c3a5a; --bubble-me:#2d6a4d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:18px/1.6 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:clamp(1.8rem,4vw,2.6rem)}
h3{font-size:1.25rem}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--coral)}
.muted{color:var(--muted)}

/* Hero */
.sky{background:linear-gradient(90deg,rgba(24,12,40,.88) 0%,rgba(24,12,40,.62) 42%,rgba(24,12,40,.08) 78%),url(img/village.jpg) center right/cover no-repeat,#3a2560;color:var(--on-sky);position:relative;overflow:hidden}
.sky header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.5rem;text-decoration:none}
.brand small{display:block;font:600 .68rem var(--body);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.langsw{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(24,12,40,.55)}
.langsw button{font:700 .85rem var(--body);padding:6px 12px;border-radius:999px;border:0;background:transparent;color:var(--on-sky);cursor:pointer}
.langsw button[aria-pressed="true"]{background:#fff;color:#2b3a9f}
.hero .wrap{display:grid;grid-template-columns:minmax(0,38rem);gap:24px;padding-block:40px 80px}
.hero .copy{display:flex;flex-direction:column;gap:20px}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.8rem)}
.hero .lead{font-size:1.2rem;max-width:34em;opacity:.96}
.hero .eyebrow{color:#ffe08a}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;font:700 1.02rem var(--body);text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn.go{background:#fff;color:#c2411f;box-shadow:0 10px 24px -10px rgba(40,10,60,.55)}
.btn.ghost{border-color:rgba(255,255,255,.7);color:var(--on-sky)}
.scene{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 92%,transparent 100%);width:100%;height:auto;display:block;max-height:520px}
.beta{font-size:.92rem;opacity:.95}

/* Demo */
.demo{background:var(--bg2)}
.demo .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center;padding-block:72px}
.demo .copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.ticks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.ticks li{display:flex;gap:12px;align-items:flex-start}
.ticks i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun);color:#3b1d00;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.9rem}
.stage{display:flex;justify-content:center;min-width:0}
.phone{width:320px;max-width:100%;background:#14122b;border-radius:38px;padding:12px;box-shadow:0 30px 60px -28px rgba(60,20,90,.7);border:1px solid rgba(255,255,255,.15)}
.screen{background:var(--chat-bg);border-radius:28px;height:560px;display:flex;flex-direction:column;overflow:hidden}
.bar{background:#2b3a9f;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.bar .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,#ffcf86,#ef6a4c);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#2b1a40}
.bar b{display:block;font-size:.95rem;line-height:1.1}
.bar span{font-size:.72rem;opacity:.8}
.feed{flex:1;overflow:hidden;padding:12px 10px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.msg{max-width:88%;padding:9px 12px;border-radius:16px;font-size:.84rem;line-height:1.42;animation:pop .35s ease both;color:var(--fg)}
.msg.bot{background:var(--bubble-bot);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--bubble-me);border-bottom-right-radius:4px;align-self:flex-end}
.msg p+p{margin-top:6px}
.msg .src{font-size:.72rem;color:var(--muted);display:block;margin-top:6px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px 12px;background:var(--chat-bg)}
.key:nth-child(3){grid-column:1/-1}
.key{background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:9px 8px;border-radius:10px;text-align:center;font:700 .8rem var(--body);transition:.2s}
.key.hit{background:var(--sun);color:#3b1d00;transform:scale(.97)}
.replay{margin-top:10px;font:700 .9rem var(--body);background:transparent;color:var(--fg);border:2px solid var(--coral);border-radius:999px;padding:8px 18px;cursor:pointer;align-self:flex-start}
.rbtns{display:flex;gap:10px;flex-wrap:wrap}.replay.listen{background:var(--coral);color:#fff;border-color:var(--coral)}
.note{font-size:.82rem;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* Bands */
.band .wrap{padding-block:72px;display:flex;flex-direction:column;gap:32px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--surface);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);min-width:0}
.step .ico{width:64px;height:64px}
.step p{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.two > *{min-width:0}
.kneel{width:100%;max-width:460px;height:auto;justify-self:center;border-radius:28px;box-shadow:0 30px 60px -30px rgba(80,30,0,.6);display:block}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.checks li{padding-left:34px;position:relative}
.checks li::before{content:"✓";position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center}
.checks b{font-weight:800}
.warm{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.road div{border-radius:22px;padding:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.road .when{font-weight:800;color:var(--coral);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
.join{display:grid;grid-template-columns:200px 1fr auto;gap:32px;align-items:center;background:linear-gradient(135deg,#2b3a9f,#c2411f);color:#fff8ea;border-radius:32px;padding:36px}
.join .pray{width:100%;height:100%;min-height:220px;object-fit:cover;object-position:50% 25%;border-radius:20px;display:block}
.join .qr{background:#fff;padding:10px;border-radius:18px;width:170px;height:170px}
.join .qr img{width:100%;height:100%;display:block}
.join .btn.go{align-self:flex-start}
.join > div{display:flex;flex-direction:column;gap:14px;min-width:0}
.faq details{border-bottom:1px solid var(--line);padding-block:14px}
.faq summary{cursor:pointer;font-weight:800;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";float:right;color:var(--coral)}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin-top:8px}
footer{background:var(--bg2)}
footer .wrap{padding-block:28px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}

.bere{background:#24130a}
.bfig{margin:0;position:relative;max-width:1400px;margin-inline:auto}
.bfig img{display:block;width:100%;height:auto}
.bfig figcaption{position:absolute;inset:0;display:flex;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,rgba(25,12,4,.82) 0%,rgba(25,12,4,.55) 34%,rgba(25,12,4,0) 55%);color:#fff3dc}
.bfig figcaption>div{max-width:min(26em,29%);margin-left:clamp(16px,5vw,70px);display:flex;flex-direction:column;gap:14px}
.bfig .eyebrow{color:#ffd36e}
.bfig h2{font-size:clamp(1.4rem,2.6vw,2.2rem)}.bfig figcaption p:last-child{font-size:clamp(.88rem,1.2vw,1.05rem);line-height:1.5}
@media (max-width:860px){
  .join .pray{min-height:0;height:220px}.bfig figcaption{position:static;background:#24130a;padding-block:28px}.bfig figcaption>div{max-width:none;margin-left:0}}
.easy{position:relative;display:flex;align-items:center;min-height:clamp(560px,52vw,720px);background:linear-gradient(90deg,rgba(30,14,4,.92) 0%,rgba(30,14,4,.72) 34%,rgba(30,14,4,0) 62%),url(img/abuela.jpg) 72% center/cover no-repeat,#1e0e04;color:#fff3dc}
.easy-in{width:100%;max-width:1080px;margin:0 auto;padding-block:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.easy-in>*{max-width:min(30rem,100%)}
.easy .eyebrow{color:#ffd36e}
.easy h2{font-size:clamp(2rem,4.6vw,3.4rem)}
.easy p:not(.eyebrow){font-size:1.15rem}
.easy .btn.go{margin-top:6px}
@media (max-width:860px){.easy{align-items:flex-end;min-height:680px;background:linear-gradient(180deg,rgba(30,14,4,0) 18%,rgba(30,14,4,.78) 52%,rgba(30,14,4,.95) 100%),url(img/abuela.jpg) 68% 20%/cover no-repeat,#3a2410}.easy-in{padding-block:32px}}
.faith{display:flex;align-items:center;min-height:clamp(560px,50vw,680px);background:linear-gradient(90deg,rgba(24,12,4,.9) 0%,rgba(24,12,4,.72) 38%,rgba(24,12,4,.05) 72%),url(img/rollo.jpg) 60% center/cover no-repeat,#24130a;color:#fff3dc}
.faith-in{width:100%;max-width:1080px;margin:0 auto;padding-block:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.faith-in>*{max-width:min(31rem,100%)}
.faith .eyebrow{color:#ffd36e}
.faith h2{font-size:clamp(1.9rem,4vw,3rem)}
.faith .checks li::before{background:#ffd36e;color:#3b1d00}
@media (max-width:860px){.faith{align-items:flex-end;min-height:720px;background:linear-gradient(180deg,rgba(24,12,4,.05) 6%,rgba(24,12,4,.82) 45%,rgba(24,12,4,.96) 100%),url(img/rollo.jpg) 55% 0/auto 55% no-repeat,#24130a}.faith-in{padding-block:28px}}
.close{display:flex;align-items:center;min-height:clamp(560px,50vw,680px);background:linear-gradient(90deg,rgba(30,14,4,0) 0%,rgba(30,14,4,0) 16%,#1e0e04 40%),url(img/oracion.jpg) left center/auto 100% no-repeat,#1e0e04;color:#fff3dc}
.close-in{width:100%;max-width:1080px;margin:0 auto;padding-block:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:flex-end}
.close-box{max-width:30rem;display:flex;flex-direction:column;gap:18px}
.close h2{font-size:clamp(2rem,4.4vw,3.2rem)}
.close p{font-size:1.15rem}
.close-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.close .qr{background:#fff;padding:8px;border-radius:16px;width:132px;height:132px}
.close .qr img{width:100%;height:100%;display:block}
@media (max-width:860px){.close{align-items:flex-end;min-height:860px;background:linear-gradient(180deg,rgba(30,14,4,0) 20%,rgba(30,14,4,.88) 52%,#1e0e04 100%),url(img/oracion.jpg) 50% 0/100% auto no-repeat,#1e0e04}.close-in{padding-block:28px}}
.busy{background:var(--bg)}
.busy-in{max-width:1080px;margin:0 auto;padding:72px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.busy-l{display:flex;flex-direction:column;gap:16px;min-width:0}
.busy h2{font-size:clamp(1.9rem,4.2vw,3rem)}
.busy-r{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.busy-r li{display:flex;flex-direction:column;gap:4px;padding:20px 22px;border-radius:22px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sun);min-width:0}
.busy-r b{font:700 1.25rem var(--display)}
.busy-r span{color:var(--muted)}
@media (max-width:860px){.busy-in{grid-template-columns:1fr;padding-block:48px;gap:28px}}
.teach{background:linear-gradient(135deg,#232f86 0%,#4a3a9a 55%,#b4452c 100%);color:#fff8ea}
.teach-in{max-width:1080px;margin:0 auto;padding:72px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.teach-l{display:flex;flex-direction:column;gap:18px;align-items:flex-start;min-width:0}
.teach .eyebrow{color:#ffd36e}
.teach h2{font-size:clamp(1.9rem,4vw,2.9rem)}
.teach-r{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.teach-r li{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);min-width:0}
.teach-r b{font:700 1.08rem var(--display)}
.teach-r li>span{font-size:.95rem;opacity:.92}
.teach-r em{font:700 .66rem var(--body);letter-spacing:.08em;text-transform:uppercase;background:#ffd36e;color:#3b1d00;border-radius:999px;padding:2px 8px;vertical-align:2px;font-style:normal;white-space:nowrap}
@media (max-width:860px){.teach-in{grid-template-columns:1fr;padding-block:48px;gap:28px}.teach-r{grid-template-columns:1fr}}
/* Recording mode */
.rec header,.rec section:not(.demo),.rec footer,.rec .demo .copy{display:none}
.rec .demo .wrap{grid-template-columns:1fr;padding-block:24px}
.rec .demo{min-height:100vh;display:grid;place-items:center}
.rec .phone{width:420px}.rec .screen{height:760px}.rec .msg{font-size:1.05rem}.rec .key{font-size:1rem}
.rec .replay,.rec .note{display:none}
.caption{display:none}
.rec .caption{display:block;text-align:center;font:700 1.5rem var(--display);padding-top:20px}

@media (max-width:860px){
  .join .pray{min-height:0;height:220px}
  .hero .wrap,.demo .wrap,.two,.join{grid-template-columns:1fr}
  .sky{background:linear-gradient(180deg,rgba(24,12,40,.9) 0%,rgba(24,12,40,.72) 55%,rgba(24,12,40,.35) 100%),url(img/village.jpg) 70% center/cover no-repeat,#3a2560}
  .hero .wrap{padding-block:24px 48px}
  .steps,.road{grid-template-columns:1fr}
  .demo .wrap,.band .wrap{padding-block:48px}
  .join .qr{justify-self:center}
}
@media (prefers-reduced-motion:reduce){.msg,.typing i{animation:none}}
</style>

<div class="sky">
<header><div class="wrap">
  <a class="brand" href="#top" aria-label="Berea">
    <img src="img/logo-berea.png" width="44" height="44" alt="" style="border-radius:50%;display:block">
    <span>Berea<small data-t="tag">Adventista</small></span>

  <div class="langsw" role="group" aria-label="Idioma · Język · Language · Sprache">
    <button type="button" data-set="pl" aria-pressed="false">PL</button>
    <button type="button" data-set="en" aria-pressed="false">EN</button>
    <button type="button" data-set="es" aria-pressed="false">ES</button>
  </div>
</div></header>
<section class="hero" id="top"><div class="wrap">
  <div class="copy">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>

</div></section>
</div>

      <li><b data-t="bz1h"></b><span data-t="bz1p"></span></li>

</section>

<section class="demo" id="demo"><div class="wrap">
  <div class="copy">
    <p class="eyebrow" data-t="demoEye"></p>
    <h2 data-t="demoH"></h2>
    <p class="muted" data-t="demoP"></p>
    <ul class="ticks">
      <li><i>1</i><span data-t="t1"></span></li>
      <li><i>2</i><span data-t="t2"></span></li>

    <div>
      <div class="phone"><div class="screen">

      </div></div>
      <div class="caption" id="cap"></div>
    </div>

</div></section>

<section class="bere">
  <figure class="bfig">
    <img src="img/bereans.jpg" alt="Un grupo de creyentes de Berea estudiando un rollo juntos bajo la luz de una ventana" width="1600" height="900" loading="lazy">
    <figcaption><div><p class="eyebrow" data-t="bereEye"></p><h2 data-t="bereH"></h2><p data-t="bereP"></p></div></figcaption>
  </figure>
</section>

<section class="band"><div class="wrap">

en:{th5h:"Suggested hymn of the day",th5p:"Every day, the hymn from the hymnal that fits the message of the lesson.",th6h:"Send to your class",th6p:"Send the summary and questions to your group with one tap.", teachEye:"For Sabbath School teachers",teachH:"Arrive at class with the lesson already prepared.",teachP:"Berea prepares the lesson for you: it summarizes it, explains it and gives you questions to lead the discussion. You are still the teacher; Berea saves you hours of preparation.",th1h:"Lesson summary",th1p:"The essentials of the topic, in plain words.",th2h:"Questions for your class",th2p:"To open the conversation and encourage participation.",th3h:"Explanation of the texts",th3p:"What the passage says and how it connects with the lesson.",th4h:"Full class plan",th4p:"Opening, discussion, application and prayer, in 30 or 45 minutes.",teachSoon:"Soon", busyEye:"We know you are busy",busyH:"You don't have time to read the whole lesson every day. Berea does.",busyP:"Berea is an artificial intelligence assistant that works like a patient teacher on your phone: it reads the lesson for you and tells it in plain words. It does not replace the full lesson or your pastor; it helps you get to it.",bz1h:"It explains it",bz1p:"The day's topic in plain language, with the verse and its reference.",bz2h:"It summarizes it",bz2p:"In a minute you know what it is about, even if you couldn't read it today.",bz3h:"It prepares the questions",bz3p:"To think about during the day or to bring to your Sabbath School class.", privL:"Privacy policy",termsL:"Terms of use",easyEye:"Jeremiah 6:16 · The ancient paths",easyH:"The same Bible, on today's phone.",easyP:"The ancient paths, with a modern tool. If you can send a message, you can use Berea: one button leads to the summary, another to the questions.",listen:"🔊 Listen with voice",bereEye:"Acts 17:11",bereH:"The Bereans studied every day.",bereP:"When Paul preached to them, they did not accept everything blindly: they searched the S de:{th5h:"Liedvorschlag des Tages",th5p:"Jeden Tag das Lied aus dem Liederbuch, das zur Botschaft der Lektion passt.",th6h:"An deine Klasse senden",th6p:"Sende Zusammenfassung und Fragen mit einem Tipp an deine Gruppe.", teachEye:"Für Sabbatschul-Lehrer",teachH:"Komm mit fertig vorbereiteter Lektion in deine Klasse.",teachP:"Berea bereitet die Lektion für dich vor: Sie fasst sie zusammen, erklärt sie und gibt dir Fragen für die Gesprächsleitung. Du bleibst der Lehrer; Berea spart dir Stunden an Vorbereitung.",th1h:"Zusammenfassung der Lektion",th1p:"Das Wesentliche des Themas in einfachen Worten.",th2h:"Fragen für deine Klasse",th2p:"Um das Gespräch zu eröffnen und zur Beteiligung anzuregen.",th3h:"Erklärung der Bibeltexte",th3p:"Was die Stelle sagt und wie sie zur Lektion passt.",th4h:"Kompletter Unterrichtsplan",th4p:"Einstieg, Gespräch, Anwendung und Gebet, in 30 oder 45 Minuten.",teachSoon:"Bald", busyEye:"Wir wissen, dass du beschäftigt bist",busyH:"Du hast keine Zeit, jeden Tag die ganze Lektion zu lesen. Berea schon.",busyP:"Berea ist ein KI-Assistent, der wie ein geduldiger Lehrer auf deinem Handy die Lektion für dich liest und sie in einfachen Worten erzählt. Er ersetzt weder die vollständige Lektion noch deinen Pastor, sondern hilft dir, zu ihr zu finden.",bz1h:"Er erklärt sie",bz1p:"Das Tagesthema in einfacher Sprache, mit Bibelvers und Stellenangabe.",bz2h:"Er fasst sie zusammen",bz2p:"In einer Minute weißt du, worum es geht, auch wenn du heute nicht lesen konntest.",bz3h:"Er bereitet die Fragen vor",bz3p:"Zum Nachdenken im Laufe des Tages oder für deine Sabbatschulklasse.", privL:"Datenschutz",termsL:"Nutzungsbedingungen",easyEye:"Jeremia 6,16 · Die alten Wege",easyH:"Dieselbe Bibel, auf dem Handy von heute.",easyP:"Die alten Wege, mit einem modernen Werkzeug. Wer eine Nachricht senden kann, kann Berea nutzen: Ein Button führt zur Zusammenfassung, einer zu den Fragen.",listen:"🔊 Mit Stimme anhören",bereEye:"Apostelgeschichte 17,11",bereH:"Die Beröer studierten jeden Tag.",bereP:"Als Paulus zu ihnen sprach, nahmen sie nicht alles ungeprüft an: Sie forschten täglich in den Schriften, um es zu prüfen. Daher kommt der Name Berea.",tag:"Adventistisch",eyebrow:"Für Adventgemeinden",h1:"Die ganze Sabbatschul-Lektion, in einem Button.",lead:"Berea erklärt die Lektion in einfachen Worten, fasst den Tag zusammen und bereitet Fragen für deine Klasse vor. Sie beantwortet auch Fragen zur ganzen Bibel, den 28 Glaubensüberzeugungen und Ellen G. White. Telegram öffnen, Button tippen, fertig.",cta:"20 Tage kostenlos testen",cta2:"So funktioniert es",beta:"20 Tage kostenlos. Danach Monat für Monat.",

k1:"Zusammenfassung der Lektion",k2:"Fragen für meine Klasse",k3:"Meine Klasse vorbereiten",b4:"<p>🧑‍🏫 <b>Deine Klasse, bereit</b></p><p><b>Kernidee:</b> Gott gebrauchte verschiedene Menschen, um uns sein Wort schriftlich zu hinterlassen.</p><p><b>Schlüsseltexte:</b> 2. Mose 17,14 · Jeremia 36,2</p><p><b>Zum Gespräch:</b> Was verändert sich in dir, wenn du weißt, dass Gott seine Botschaft aufgeschrieben haben wollte?</p><p><b>Anwenden:</b> Lies diese Woche jeden Tag eine Stelle.</p>",k4:"Unterrichtsplan 30 Min.",b5:"<p>⏱ <b>30-Minuten-Plan</b></p><p>Einstieg und Gebet · 3 Min.</p><p>Themenwiederholung · 7 Min.</p><p>Gespräch · 12 Min.</p><p>Anwendung · 5 Min.</p><p>Abschluss und Gebet · 3 Min.</p>",k5:"Lied des Tages · Bald",b6:"<p>🎵 <b>Liedvorschlag des Tages</b></p><p>Berea schlägt dir jeden Tag das Lied aus dem Liederbuch vor, das zur Botschaft der Lektion passt.</p>",

faqH:"Häufige Fragen",q1:"Ist das ein offizieller Dienst der Adventgemeinde?",a1:"Nein. Berea ist ein unabhängiges Projekt von Gemeindegliedern zur Förderung des täglichen Bibelstudiums.",q2:"Ersetzt es die Sabbatschul-Lektion?",a2:"Nein. Es begleitet sie und führt immer zur vollständigen Lektion.",q3:"Muss ich etwas installieren?",a3:"Ja, du musst Telegram installieren, kostenlos auf deinem Handy. Dann scanne den QR-Code auf dieser Seite mit der Kamera (oder tippe den Button), der Chat mit Berea öffnet sich und du tippst einen Button.",q4:"Was kostet es?",a4:"Du hast 20 Tage kostenlos. Danach zahlst du Monat für Monat, und dein Abo hilft Berea, weiter zu wachsen und dein persönlicher Studienassistent zu bleiben. Die Ersten behalten ihren Preis und bekommen Verbesserungen ohne Aufpreis. Die Preise für Gemeinden geben wir vor Februar bekannt.",

var KEY="berea-lang",L="pl",timer=0,run=0,aud=null,noLoop=false;
function stopAud(){if(aud){try{aud.pause()}catch(e){}aud=null}noLoop=false}
var feed=document.getElementById("feed"),k1=document.getElementById("k1"),k2=document.getElementById("k2"),k3=document.getElementById("k3"),k4=document.getElementById("k4"),k5=document.getElementById("k5"),cap=document.getElementById("cap");
var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
if(location.search.indexOf("rec")>-1||location.hash==="#rec")document.documentElement.classList.add("rec");
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function add(cls,html){var d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;feed.appendChild(d);while(feed.children.length>5)feed.removeChild(feed.firstChild);return d}
function typing(){var d=document.createElement("div");d.className="msg bot typing";d.innerHTML="<i></i><i></i><i></i>";feed.appendChild(d);return d}
function press(k){k.classList.add("hit");setTimeout(function(){k.classList.remove("hit")},500)}
async function play(){
  var id=++run,t=T[L];feed.innerHTML="";
  function alive(){return id===run}
  var steps=[
   ["me",t.u0],["bot",t.b0],["key",k1,t.k1],["bot",t.b1],["key",k2,t.k2],["bot",t.b2],["key",k3,t.k3],["bot",t.b4],["key",k4,t.k4],["bot",t.b5],["key",k5,t.k5],["bot",t.b6],["me","<p>"+t.u3+"</p>"],["bot",t.b3]];
  if(still){steps.forEach(function(s){if(s[0]==="me")add("me",s[1]);if(s[0]==="bot")add("bot",s[1])});return}
  await sleep(500);
  for(var i=0;i<steps.length;i++){
    if(!alive())return;var s=steps[i];
    if(s[0]==="me"){add("me",s[1]);await sleep(700)}
    else if(s[0]==="key"){await sleep(900);press(s[1]);if(!alive())return;add("me","<p>"+s[2]+"</p>");await sleep(500)}
    else{var ty=typing();await sleep(1100);if(ty.parentNode)ty.parentNode.removeChild(ty);if(!alive())return;add("bot",s[1]);await sleep(i===13?0:s[1].length>200?3600:2200)}
  }
  if(!alive())return;await sleep(4000);if(alive()&&!window.__norep&&!noLoop)play();
}
function apply(l){
  stopAud();L=l;var t=T[l],r=document.documentElement;r.lang=l;
  document.querySelectorAll("[data-t]").forEach(function(e){e.innerHTML=t[e.getAttribute("data-t")]});
  k1.textContent=t.k1;k2.textContent=t.k2;k3.textContent=t.k3;k4.textContent=t.k4;k5.textContent=t.k5;cap.textContent=t.demoH;
  document.querySelectorAll(".langsw button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-set")===l?"true":"false")});
  try{localStorage.setItem(KEY,l)}catch(e){}
  play();
}
var cur="pl";
try{var s=localStorage.getItem(KEY);if(T[s]&&s!=="de")cur=s}catch(e){}
document.querySelectorAll(".langsw button").forEach(function(b){b.addEventListener("click",function(){apply(b.getAttribute("data-set"))})});
document.getElementById("replay").addEventListener("click",function(){stopAud();play()});
document.getElementById("listen").addEventListener("click",function(){stopAud();noLoop=true;try{aud=new Audio("audio/narr_"+L+".mp3");aud.play().catch(function(){})}catch(e){}play()});
apply(cur);
})();
</script>
